# Build the omp CLI binary on native Windows arm64.
#
# This workflow is self-contained: the Windows 11 arm64 runner builds the
# addon with the installed ARM64 MSVC toolchain, embeds it in the CLI, and
# uploads the completed artifacts. No Linux cross-compile tools or artifacts
# from another workflow participate.
#
# Usage:
#   - Trigger manually (workflow_dispatch) for an ad-hoc native arm64 build.
#   - Supply a tag (e.g. v0.12.0) to create or update its GitHub Release with
#     the completed arm64 binary.

name: Build win-arm64 binary

on:
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Release tag (e.g., v0.12.0). When set, this workflow creates or
          updates the release with the completed Windows arm64 binary.
        required: false
        type: string
      source_ref:
        description: >-
          Git ref to check out (defaults to the triggering SHA). Useful when
          recovering a release after a failed run.
        required: false
        type: string

permissions: {}

concurrency:
  group: build-win-arm64-${{ github.event.inputs.tag || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: Build win32-arm64 binary
    runs-on: windows-11-arm
    permissions:
      contents: write # gh release upload
    env:
      SOURCE_REF: ${{ github.event.inputs.source_ref || github.sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.SOURCE_REF }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4"

      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-08

      - name: Enable native ARM64 MSVC build environment
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          if (-not $vsRoot) {
            throw "Visual Studio ARM64 C++ tools are not installed"
          }
          $devCmd = Join-Path $vsRoot "Common7\Tools\VsDevCmd.bat"
          $environment = & cmd.exe /d /s /c "call `"$devCmd`" -arch=arm64 -host_arch=arm64 >nul && set"
          foreach ($entry in $environment) {
            if ($entry -match "^[^=]+=.*$") {
              $entry | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
          $toolchain = Join-Path $env:RUNNER_TEMP "omp-arm64-msvc.cmake"
          @(
            "set(CMAKE_POLICY_DEFAULT_CMP0091 NEW)"
            "set(CMAKE_MSVC_RUNTIME_LIBRARY MultiThreaded)"
          ) | Set-Content -Path $toolchain -Encoding utf8
          @(
            "CMAKE_TOOLCHAIN_FILE_aarch64_pc_windows_msvc=$toolchain"
            "CFLAGS=/MT"
            "CXXFLAGS=/MT"
            "RUSTFLAGS=-C target-feature=+crt-static"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: bun install --frozen-lockfile

      - name: Build native addon (win32-arm64)
        shell: pwsh
        env:
          OMP_NATIVE_CARGO_PROFILE: ci
        run: bun --cwd=packages/natives run build:bindings

      - name: Assert win32-arm64 native addon is present
        shell: pwsh
        run: if (-not (Test-Path packages/natives/native/pi_natives.win32-arm64.node)) { throw "Native addon was not built" }

      - name: Build release binary (win32-arm64)
        shell: pwsh
        env:
          RELEASE_TARGETS: win32-arm64
        run: bun run ci:release:build-binaries

      - name: Smoke release binary
        shell: pwsh
        run: |
          $runtimeDir = Join-Path $env:RUNNER_TEMP "omp-win-arm64-smoke"
          New-Item -ItemType Directory -Force -Path $runtimeDir | Out-Null
          $env:HOME = Join-Path $runtimeDir "home"
          $env:XDG_DATA_HOME = Join-Path $runtimeDir "xdg"
          $binary = (Resolve-Path "packages/coding-agent/binaries/omp-windows-arm64.exe").Path
          & $binary --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $binary --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload native addon artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pi-natives-win32-arm64
          path: packages/natives/native/pi_natives.win32-arm64.node
          compression-level: 0
          if-no-files-found: error

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omp-windows-arm64
          path: packages/coding-agent/binaries/omp-windows-arm64.exe
          compression-level: 0
          if-no-files-found: error

      - name: Create or update GitHub Release
        if: ${{ github.event.inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          $binary = "packages/coding-agent/binaries/omp-windows-arm64.exe"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $binary --clobber
          } else {
            gh release create $tag --title $tag --generate-notes $binary
          }

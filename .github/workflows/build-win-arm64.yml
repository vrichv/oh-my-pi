# Build the omp CLI binary for Windows arm64.
#
# Standalone workflow (not part of the main CI release pipeline). Upstream
# Bazel only ships a win32-x64 MSVC toolchain, so this path cross-compiles
# the native addon with napi-rs + cargo-xwin, then `bun --compile`s the CLI
# for `bun-windows-arm64`.
#
# Usage:
#   - Trigger manually (workflow_dispatch) for ad-hoc builds.
#   - Supply a tag (e.g. v0.12.0) to also create/update a GitHub Release
#     with the binary attached.

name: Build win-arm64 binary

on:
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Release tag (e.g., v0.12.0). When set, the built binary is uploaded to
          an existing release with this tag.
        required: false
        type: string
      source_ref:
        description: >-
          Git ref to check out (defaults to the triggering ref). Useful when
          recovering a release after a failed run.
        required: false
        type: string

# No top-level permissions — each job declares what it needs.
permissions: {}

concurrency:
  group: build-win-arm64-${{ github.event.inputs.tag || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: Build win32-arm64 binary
    runs-on: ubuntu-22.04
    permissions:
      contents: write        # gh release upload
      id-token: write        # npm trusted publishing (optional)
    env:
      SOURCE_REF: ${{ github.event.inputs.source_ref || github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.SOURCE_REF }}

      # ---------- toolchain ----------
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4"

      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-08
          targets: aarch64-pc-windows-msvc

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Enable sccache for cargo
        shell: bash
        run: |
          {
            echo "SCCACHE_GHA_ENABLED=true"
            echo "RUSTC_WRAPPER=sccache"
            echo "CARGO_INCREMENTAL=0"
          } >> "$GITHUB_ENV"

      # ---------- MSVC cross-compile tooling ----------
      - name: Install LLVM tooling (MSVC cross-compile)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm

      - name: Install cargo-xwin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-xwin

      - name: Cache cargo-xwin Windows SDK
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/cargo-xwin
          key: cargo-xwin-win-arm64-v1

      - name: Accept xwin license
        run: echo "XWIN_ACCEPT_LICENSE=1" >> "$GITHUB_ENV"

      # ---------- deps ----------
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - run: bun install --frozen-lockfile

      # ---------- native addon ----------
      - name: Build native addon (win32-arm64)
        shell: bash
        env:
          CROSS_TARGET: aarch64-pc-windows-msvc
          TARGET_PLATFORM: win32
          TARGET_ARCH: arm64
          OMP_NATIVE_CARGO_PROFILE: ci
        run: bun --cwd=packages/natives run build:bindings

      # ---------- compiled binary ----------
      - name: Build release binary (win32-arm64)
        env:
          RELEASE_TARGETS: win32-arm64
        run: bun run ci:release:build-binaries

      # ---------- upload / release ----------
      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omp-windows-arm64
          path: packages/coding-agent/binaries/omp-windows-arm64.exe
          compression-level: 0
          if-no-files-found: error

      - name: Attach binary to GitHub Release
        if: ${{ github.event.inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag }}"
          BINARY="packages/coding-agent/binaries/omp-windows-arm64.exe"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${BINARY}" --clobber
          else
            gh release create "${TAG}" \
              --title "${TAG}" \
              --generate-notes \
              "${BINARY}"
          fi
